<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas — Iniciar sesión</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #121016;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f3e8ee; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  .card {
    width: 100%; max-width: 360px; text-align: center;
    background: rgba(28, 22, 34, 0.75);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(244, 114, 182, 0.2);
    border-radius: 20px; padding: 2.2rem 1.6rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  /* ---------- Lluvia de brillo ---------- */
  .lluvia { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .chispa { position: absolute; top: -20px; animation: caer linear infinite; will-change: transform; }
  .chispa i {
    display: block; font-style: normal; line-height: 1;
    color: var(--c); text-shadow: 0 0 6px var(--c), 0 0 12px var(--c);
    animation: titilar ease-in-out infinite alternate;
  }
  @keyframes caer {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate(var(--sway), 55vh) rotate(180deg); }
    92%  { opacity: 1; }
    100% { transform: translate(0, 110vh) rotate(360deg); opacity: 0; }
  }
  @keyframes titilar {
    0%   { opacity: 0.25; transform: scale(0.6); }
    60%  { opacity: 1;    transform: scale(1.15); }
    100% { opacity: 0.5;  transform: scale(0.85); }
  }
  @media (prefers-reduced-motion: reduce) { .lluvia { display: none; } }
  .card { position: relative; z-index: 1; }
  h1 { font-size: 1.25rem; font-weight: 700; color: #fdf2f8; margin-bottom: 0.3rem; }
  p.sub { font-size: 0.82rem; color: #b39db2; margin-bottom: 1.6rem; }
  .btn-google {
    width: 100%; height: 44px; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #db2777); color: #fff;
    font-family: inherit; font-weight: 700; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: filter 0.2s;
  }
  .btn-google:hover { filter: brightness(1.1); }
  .btn-google:disabled { filter: grayscale(0.6) brightness(0.7); cursor: wait; }
  .btn-google svg { background: #fff; border-radius: 50%; padding: 3px; width: 22px; height: 22px; }
  .estado { font-size: 0.75rem; min-height: 1.2em; margin-top: 1rem; color: #b39db2; }
  .estado.err { color: #fb7185; }
  .otra { display: block; margin-top: 1.4rem; font-size: 0.75rem; color: #f472b6; text-decoration: none; opacity: 0.8; }
  .otra:hover { opacity: 1; }
</style>
</head>
<body>
<div class="lluvia" id="lluvia" aria-hidden="true"></div>
<div class="card">
  <h1>Tareas</h1>
  <p class="sub">Matriz de prioridades</p>
  <button class="btn-google" id="btn-login" disabled>
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
    Entrar con Google
  </button>
  <div class="estado" id="estado">Verificando sesión…</div>
</div>

<script>
// Brillo cayendo: destellos en la paleta sakura que titilan mientras bajan
(() => {
  const colores = ['#f472b6', '#fb7185', '#fbcfe8', '#c084fc', '#fcd34d', '#ffffff'];
  const formas  = ['✦', '✧', '·', '✦', '•'];
  const cont = document.getElementById('lluvia');
  const n = window.innerWidth < 600 ? 26 : 45;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('span');
    c.className = 'chispa';
    const forma = formas[Math.floor(Math.random() * formas.length)];
    const tam = forma === '·' || forma === '•' ? 6 + Math.random() * 6 : 7 + Math.random() * 9;
    c.style.cssText = `left:${Math.random() * 100}%;font-size:${tam}px;` +
      `animation-duration:${7 + Math.random() * 8}s;animation-delay:${-Math.random() * 15}s;` +
      `--sway:${(Math.random() * 80 - 40).toFixed(0)}px;--c:${colores[Math.floor(Math.random() * colores.length)]};`;
    const brillo = document.createElement('i');
    brillo.textContent = forma;
    brillo.style.animationDuration = (0.6 + Math.random() * 1.4).toFixed(2) + 's';
    brillo.style.animationDelay = (-Math.random() * 2).toFixed(2) + 's';
    c.appendChild(brillo);
    cont.appendChild(c);
  }
})();
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// Proyecto del hub (tareas, notas, biblioteca) — separado de finanzas.
const firebaseConfig = {
  apiKey: "AIzaSyC0qxV-1pMZt3Zrhsd2LYP19E8qR5PS8Eo",
  authDomain: "biblioteca-47ce1.firebaseapp.com",
  projectId: "biblioteca-47ce1",
  storageBucket: "biblioteca-47ce1.firebasestorage.app",
  messagingSenderId: "957996420213",
  appId: "1:957996420213:web:7a49c2d1238abcb88abc3c"
};

const ALLOWED_EMAIL = 'plagosh1@gmail.com';
const DESTINO = 'tareas.html';

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const btn = document.getElementById('btn-login');
const estado = document.getElementById('estado');
function setEstado(msg, err = false) { estado.textContent = msg; estado.className = 'estado' + (err ? ' err' : ''); }

// Por si el login anterior fue por redirección (navegadores que bloquean el popup)
getRedirectResult(auth).catch(e => setEstado('Error al iniciar sesión: ' + e.code, true));

onAuthStateChanged(auth, async user => {
  if (user && user.email === ALLOWED_EMAIL) {
    setEstado('Entrando…');
    window.location.replace(DESTINO);
  } else if (user) {
    await signOut(auth);
    setEstado('Esa cuenta no tiene acceso.', true);
    btn.disabled = false;
  } else {
    setEstado('');
    btn.disabled = false;
  }
});

btn.addEventListener('click', async () => {
  btn.disabled = true;
  setEstado('Abriendo Google…');
  try {
    await signInWithPopup(auth, provider);   // onAuthStateChanged se encarga de redirigir
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      await signInWithRedirect(auth, provider);
      return;
    }
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      setEstado('Error al iniciar sesión: ' + e.code, true);
    } else {
      setEstado('');
    }
    btn.disabled = false;
  }
});
</script>
</body>
</html>
