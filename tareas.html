<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas — Matriz de prioridades</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nw: 142px;   /* ancho sticky */
    --nh: 128px;   /* alto sticky */
    --borde: rgba(244, 114, 182, 0.15);
    --card: rgba(28, 22, 34, 0.65);
    --texto: #f3e8ee;
    --suave: #b39db2;
    --rosa: #f472b6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #121016;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 1.5rem;
    color: var(--texto);
    min-height: 100vh;
  }

  /* ---------- Header (igual que dashboard / gastos / finanzas) ---------- */
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    margin-bottom: 0.8rem;
    background: var(--card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 0.8rem 1.2rem;
  }
  .titulo { font-size: 1.1rem; font-weight: 700; color: #fdf2f8; letter-spacing: -0.01em; }
  .nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nav a, .nav span {
    font-size: 0.8rem; font-weight: 600; text-decoration: none;
    padding: 5px 12px; border-radius: 8px;
    color: #fdf2f8; background: rgba(45, 30, 48, 0.7); border: 1px solid rgba(244, 114, 182, 0.25);
    transition: all 0.2s;
  }
  .nav a:hover { background: rgba(244, 114, 182, 0.2); border-color: rgba(244, 114, 182, 0.4); }
  .nav span.actual { background: linear-gradient(135deg, #f472b6, #db2777); border-color: transparent; color: #fff; cursor: default; }
  .btn-logout {
    background: rgba(251, 113, 133, 0.12); border: 1px solid rgba(251, 113, 133, 0.35);
    border-radius: 8px; color: #fda4af; font-size: 0.8rem; padding: 5px 12px;
    cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.2s;
  }
  .btn-logout:hover { background: rgba(251, 113, 133, 0.22); }

  .sync-status { font-size: 0.68rem; color: #6b5a6a; text-align: right; margin-bottom: 0.8rem; }
  .sync-status.ok { color: #f472b6; }
  .sync-status.err { color: #fb7185; }

  /* ---------- Barra para agregar ---------- */
  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--card); border: 1px solid var(--borde); border-radius: 14px;
    padding: 0.7rem; margin-bottom: 1rem;
  }
  .inp, .sel {
    background: rgba(45, 30, 48, 0.7); border: 1px solid rgba(244, 114, 182, 0.2);
    border-radius: 10px; color: var(--texto); font-family: inherit; font-size: 0.85rem;
    height: 38px; padding: 0 0.8rem; outline: none; transition: border-color 0.2s;
  }
  .inp:focus, .sel:focus { border-color: rgba(244, 114, 182, 0.6); }
  .inp-titulo { flex: 1 1 220px; min-width: 160px; }
  .sel { flex: 0 0 auto; cursor: pointer; }
  .inp-fecha { flex: 0 0 auto; color-scheme: dark; }
  .btn-fijar {
    height: 38px; padding: 0 1.1rem; border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #db2777); color: #fff;
    font-family: inherit; font-weight: 700; font-size: 0.85rem; transition: filter 0.2s;
  }
  .btn-fijar:hover { filter: brightness(1.1); }
  .btn-fijar:disabled { filter: grayscale(0.6) brightness(0.7); cursor: not-allowed; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--suave); cursor: pointer; margin-left: auto; user-select: none; }
  .chk input { accent-color: #f472b6; }

  /* ---------- Matriz ---------- */
  .matriz { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .board {
    background: var(--card); border: 1px solid var(--borde); border-radius: 16px;
    padding: 0.7rem; display: flex; flex-direction: column; gap: 0.6rem;
  }
  .board-head { display: flex; align-items: center; gap: 8px; padding: 0 0.3rem; }
  .board-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px var(--acc); background: var(--acc); }
  .board-nombre { font-size: 0.9rem; font-weight: 700; color: #fdf2f8; }
  .board-sub { font-size: 0.68rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; }
  .board-count {
    margin-left: auto; font-size: 0.72rem; font-weight: 700; color: var(--acc);
    background: rgba(255,255,255,0.04); border: 1px solid var(--acc); border-radius: 20px; padding: 1px 9px;
  }

  /* Corcho */
  .corcho {
    position: relative; height: 400px; border-radius: 10px; overflow: hidden;
    background-color: #a47551;
    background-image:
      radial-gradient(rgba(60, 35, 15, 0.35) 1px, transparent 1.6px),
      radial-gradient(rgba(255, 230, 200, 0.12) 1px, transparent 1.6px),
      radial-gradient(rgba(60, 35, 15, 0.2) 1.5px, transparent 2px);
    background-size: 7px 7px, 11px 11px, 17px 17px;
    background-position: 0 0, 3px 5px, 8px 2px;
    box-shadow:
      inset 0 0 0 6px #4a3122,          /* marco de madera */
      inset 0 0 0 7px rgba(0,0,0,0.4),
      inset 0 0 28px rgba(0,0,0,0.45);
    transition: outline-color 0.15s;
    outline: 2px dashed transparent; outline-offset: -2px;
  }
  .corcho.destino { outline-color: var(--acc); }
  .vacio {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive; font-size: 1.3rem; color: rgba(40, 22, 10, 0.45); pointer-events: none;
  }

  /* Sticky note */
  .sticky {
    position: absolute; width: var(--nw); height: var(--nh);
    background: var(--papel); color: var(--tinta);
    padding: 18px 10px 8px; border-radius: 2px 2px 6px 2px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.3);
    display: flex; flex-direction: column; gap: 4px;
    cursor: grab; touch-action: none; user-select: none;
    transition: box-shadow 0.15s;
  }
  .sticky:hover { box-shadow: 0 10px 18px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3); }
  .sticky:focus-visible { outline: 2px solid #fdf2f8; outline-offset: 2px; }
  /* Chinche */
  .sticky::before {
    content: ''; position: absolute; top: 4px; left: 50%; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.85) 0 2px, var(--pin) 3px, color-mix(in srgb, var(--pin) 60%, #000) 100%);
    box-shadow: 1px 3px 3px rgba(0,0,0,0.45);
  }
  /* Esquina doblada */
  .sticky::after {
    content: ''; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--papel) 70%, #000) 50%, transparent 50%);
    border-radius: 0 0 6px 0; opacity: 0.35;
  }
  .st-titulo {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.12rem; line-height: 1.1;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word;
  }
  .st-detalle {
    font-size: 0.66rem; line-height: 1.3; opacity: 0.75;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
  }
  .st-pie { margin-top: auto; display: flex; align-items: center; gap: 4px; }
  .st-fecha { font-size: 0.6rem; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: rgba(0,0,0,0.08); }
  .st-fecha.hoy { background: #fbbf24; color: #451a03; }
  .st-fecha.vencida { background: #be123c; color: #fff; }
  .st-btn {
    background: none; border: none; cursor: pointer; font-size: 0.85rem; line-height: 1;
    color: var(--tinta); opacity: 0.45; padding: 2px 3px; border-radius: 4px; font-family: inherit;
  }
  .st-btn:hover { opacity: 0.9; background: rgba(0,0,0,0.07); }
  .st-btn.primero { margin-left: auto; }
  .sticky.hecha { opacity: 0.55; filter: saturate(0.5); }
  .sticky.hecha .st-titulo { text-decoration: line-through; text-decoration-thickness: 2px; }
  .sticky.hecha .st-btn[data-action="hecha"] { opacity: 0.9; }

  .fantasma {
    position: fixed !important; z-index: 1000; pointer-events: none; cursor: grabbing;
    box-shadow: 0 18px 30px rgba(0,0,0,0.5) !important;
  }

  /* ---------- Modal ---------- */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(10, 6, 12, 0.7); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal {
    width: 100%; max-width: 400px; background: #1c1622; border: 1px solid rgba(244, 114, 182, 0.25);
    border-radius: 18px; padding: 1.3rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal h3 { font-size: 0.95rem; color: #fdf2f8; }
  .modal label { font-size: 0.7rem; color: var(--suave); text-transform: uppercase; letter-spacing: 0.06em; display: flex; flex-direction: column; gap: 4px; }
  .modal .inp, .modal .sel { width: 100%; }
  .modal textarea.inp { height: 90px; padding: 0.6rem 0.8rem; resize: vertical; line-height: 1.4; }
  .modal-fila { display: flex; gap: 8px; }
  .modal-fila > * { flex: 1; }
  .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn-sec { background: rgba(45, 30, 48, 0.9); border: 1px solid rgba(244, 114, 182, 0.2); color: #e9d5e5; border-radius: 10px; padding: 0 14px; height: 36px; cursor: pointer; font-family: inherit; font-size: 0.82rem; }
  .btn-del { background: rgba(251, 113, 133, 0.12); border: 1px solid rgba(251, 113, 133, 0.35); color: #fda4af; border-radius: 10px; padding: 0 14px; height: 36px; cursor: pointer; font-family: inherit; font-size: 0.82rem; margin-right: auto; }
  .modal .btn-fijar { height: 36px; }

  .ayuda { font-size: 0.7rem; color: #6b5a6a; margin-top: 0.8rem; text-align: center; }

  @media (max-width: 760px) {
    :root { --nw: 120px; --nh: 110px; }
    body { padding: 1rem; }
    .matriz { grid-template-columns: 1fr; }
    .corcho { height: 330px; }
    .chk { margin-left: 0; }
    .st-titulo { font-size: 1rem; }
    .st-detalle { display: none; }
    .st-fecha { white-space: nowrap; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="titulo">📌 Tareas</div>
  <div class="nav">
    <a href="https://finanzas.corabell.app/dashboard">Dashboard</a>
    <a href="https://finanzas.corabell.app/gastos">Gastos</a>
    <a href="https://finanzas.corabell.app/finanzas">Finanzas</a>
    <span class="actual">Tareas</span>
    <button class="btn-logout" id="btn-logout">Cerrar sesión</button>
  </div>
</div>
<div class="sync-status" id="sync-status">Conectando…</div>

<div class="toolbar">
  <input class="inp inp-titulo" id="inp-titulo" placeholder="Nueva tarea…" maxlength="120"/>
  <select class="sel" id="sel-cuadrante"></select>
  <input class="inp inp-fecha" id="inp-fecha" type="date" title="Fecha límite (opcional)"/>
  <button class="btn-fijar" id="btn-fijar">📌 Fijar</button>
  <label class="chk"><input type="checkbox" id="chk-ocultar"/> Ocultar hechas</label>
</div>

<div class="matriz" id="matriz"></div>
<div class="ayuda">Arrastra una nota para moverla dentro del corcho o a otro cuadrante · toca una nota para editarla</div>

<!-- Modal editar -->
<div class="modal-bg" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <h3 id="modal-h">Editar tarea</h3>
    <label>Tarea <input class="inp" id="m-titulo" maxlength="120"/></label>
    <label>Detalle <textarea class="inp" id="m-detalle" placeholder="Notas, links, próximos pasos…"></textarea></label>
    <div class="modal-fila">
      <label>Cuadrante <select class="sel" id="m-cuadrante"></select></label>
      <label>Fecha límite <input class="inp inp-fecha" id="m-fecha" type="date"/></label>
    </div>
    <div class="modal-btns">
      <button class="btn-del" id="m-eliminar">Eliminar</button>
      <button class="btn-sec" id="m-cancelar">Cancelar</button>
      <button class="btn-fijar" id="m-guardar">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyBOQcAM_qUgsr2SiDO4ZJtHSHJP25g0GSA",
  authDomain: "finanzas-personal-12490.firebaseapp.com",
  projectId: "finanzas-personal-12490",
  storageBucket: "finanzas-personal-12490.firebasestorage.app",
  messagingSenderId: "1062344169400",
  appId: "1:1062344169400:web:75075634e2d4a416b3614d"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// Acceso: misma sesión de Google que el dashboard. Si no hay sesión válida, vuelve al login.
const ALLOWED_EMAIL = 'plagosh1@gmail.com';
function protegerPagina(alEntrar) {
  let iniciado = false;
  onAuthStateChanged(auth, async user => {
    if (user && user.email === ALLOWED_EMAIL) {
      if (!iniciado) { iniciado = true; alEntrar(); }
    } else {
      if (user) { try { await signOut(auth); } catch (e) {} }
      window.location.href = 'index.html';
    }
  });
}

// ---------- Configuración de cuadrantes (paleta sakura) ----------
const CUADRANTES = {
  hacer:      { nombre: 'Hacer ahora',  sub: 'Urgente · Importante',       acc: '#e11d48', papel: '#fda4af', tinta: '#4c0519' },
  planificar: { nombre: 'Planificar',   sub: 'No urgente · Importante',    acc: '#f472b6', papel: '#fbcfe8', tinta: '#500724' },
  delegar:    { nombre: 'Delegar',      sub: 'Urgente · No importante',    acc: '#fb923c', papel: '#fed7aa', tinta: '#431407' },
  soltar:     { nombre: 'Soltar',       sub: 'No urgente · No importante', acc: '#c084fc', papel: '#e9d5ff', tinta: '#3b0764' },
};
const ORDEN = ['hacer', 'planificar', 'delegar', 'soltar'];

let tareas = [];
let ocultarHechas = false;
try { ocultarHechas = localStorage.getItem('tareas_ocultar_hechas') === '1'; } catch (e) {}
document.getElementById('chk-ocultar').checked = ocultarHechas;

const $ = id => document.getElementById(id);
function setSync(msg, cls = '') { const el = $('sync-status'); el.textContent = msg; el.className = 'sync-status ' + cls; }
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rotAleatoria = () => +(Math.random() * 6 - 3).toFixed(1);
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function cuadranteDe(t) { return CUADRANTES[t.cuadrante] ? t.cuadrante : 'hacer'; }

// Selects
const opciones = ORDEN.map(q => `<option value="${q}">${CUADRANTES[q].nombre} — ${CUADRANTES[q].sub}</option>`).join('');
$('sel-cuadrante').innerHTML = opciones;
$('m-cuadrante').innerHTML = opciones;

// ---------- Construir las 4 pizarras ----------
const corchos = {}, contadores = {};
ORDEN.forEach(q => {
  const c = CUADRANTES[q];
  const board = document.createElement('section');
  board.className = 'board';
  board.style.setProperty('--acc', c.acc);
  board.innerHTML = `
    <div class="board-head">
      <span class="board-dot"></span>
      <div><div class="board-nombre">${c.nombre}</div><div class="board-sub">${c.sub}</div></div>
      <span class="board-count" title="Pendientes">0</span>
    </div>
    <div class="corcho" data-q="${q}"></div>`;
  $('matriz').appendChild(board);
  corchos[q] = board.querySelector('.corcho');
  contadores[q] = board.querySelector('.board-count');
});

// ---------- Render ----------
let drag = null;
let renderPendiente = false;

function crearSticky(t) {
  const c = CUADRANTES[cuadranteDe(t)];
  const el = document.createElement('div');
  el.className = 'sticky' + (t.hecha ? ' hecha' : '');
  el.dataset.id = t.id;
  el.tabIndex = 0;
  el.style.setProperty('--papel', c.papel);
  el.style.setProperty('--tinta', c.tinta);
  el.style.setProperty('--pin', c.acc);
  el.style.left = `calc(${t.x ?? 0.5} * (100% - var(--nw)))`;
  el.style.top  = `calc(${t.y ?? 0.5} * (100% - var(--nh)))`;
  el.style.transform = `rotate(${t.rot || 0}deg)`;

  const titulo = document.createElement('div');
  titulo.className = 'st-titulo';
  titulo.textContent = t.titulo;
  el.appendChild(titulo);

  if (t.detalle) {
    const det = document.createElement('div');
    det.className = 'st-detalle';
    det.textContent = t.detalle;
    el.appendChild(det);
  }

  const pie = document.createElement('div');
  pie.className = 'st-pie';
  if (t.fecha) {
    const [, m, d] = t.fecha.split('-');
    const f = document.createElement('span');
    f.className = 'st-fecha';
    const hoy = hoyISO();
    if (!t.hecha && t.fecha < hoy) { f.classList.add('vencida'); f.textContent = `venció ${+d}/${+m}`; }
    else if (t.fecha === hoy)      { f.classList.add('hoy');     f.textContent = 'hoy'; }
    else                           { f.textContent = `${+d}/${+m}`; }
    pie.appendChild(f);
  }
  pie.insertAdjacentHTML('beforeend',
    `<button class="st-btn primero" data-action="hecha" title="${t.hecha ? 'Marcar pendiente' : 'Marcar hecha'}">✓</button>
     <button class="st-btn" data-action="eliminar" title="Eliminar">×</button>`);
  el.appendChild(pie);
  return el;
}

function render() {
  if (drag) { renderPendiente = true; return; }
  ORDEN.forEach(q => {
    const corcho = corchos[q];
    corcho.innerHTML = '';
    const delCuadrante = tareas.filter(t => cuadranteDe(t) === q);
    contadores[q].textContent = delCuadrante.filter(t => !t.hecha).length;
    const visibles = delCuadrante.filter(t => !(ocultarHechas && t.hecha));
    if (!visibles.length) { corcho.innerHTML = '<div class="vacio">sin tareas por aquí</div>'; return; }
    // Las hechas quedan debajo; las más nuevas encima
    visibles.sort((a, b) => (a.hecha === b.hecha ? 0 : a.hecha ? -1 : 1));
    visibles.forEach(t => corcho.appendChild(crearSticky(t)));
  });
}

// Busca un hueco en el corcho: prueba 24 posiciones y elige la más alejada de las demás notas
function posicionLibre(q, excluirId = null) {
  const otras = tareas.filter(t => cuadranteDe(t) === q && !t.hecha && t.id !== excluirId);
  let mejor = { x: 0.5, y: 0.5 }, mejorD = -1;
  for (let i = 0; i < 24; i++) {
    const c = { x: Math.random(), y: Math.random() };
    const d = otras.length ? Math.min(...otras.map(o => Math.hypot((o.x ?? .5) - c.x, (o.y ?? .5) - c.y))) : 1;
    if (d > mejorD) { mejorD = d; mejor = c; }
  }
  return { x: +mejor.x.toFixed(3), y: +mejor.y.toFixed(3) };
}

async function guardar(id, cambios) {
  try { await updateDoc(doc(db, 'tareas', id), cambios); }
  catch (e) { setSync('Error al guardar: ' + e.message, 'err'); }
}

// ---------- Agregar ----------
async function agregar() {
  const titulo = $('inp-titulo').value.trim();
  if (!titulo) { $('inp-titulo').focus(); return; }
  const q = $('sel-cuadrante').value;
  const btn = $('btn-fijar');
  btn.disabled = true;
  try {
    await addDoc(collection(db, 'tareas'), {
      titulo, detalle: '', cuadrante: q,
      fecha: $('inp-fecha').value || null,
      hecha: false, ...posicionLibre(q), rot: rotAleatoria(),
      creadoEn: new Date().toISOString()
    });
    $('inp-titulo').value = '';
    $('inp-fecha').value = '';
    $('inp-titulo').focus();
  } catch (e) { setSync('Error al guardar: ' + e.message, 'err'); }
  btn.disabled = false;
}
$('btn-fijar').addEventListener('click', agregar);
$('inp-titulo').addEventListener('keydown', e => { if (e.key === 'Enter') agregar(); });

$('chk-ocultar').addEventListener('change', e => {
  ocultarHechas = e.target.checked;
  try { localStorage.setItem('tareas_ocultar_hechas', ocultarHechas ? '1' : '0'); } catch (err) {}
  render();
});

// ---------- Botones de la nota ----------
$('matriz').addEventListener('click', async e => {
  const btn = e.target.closest('.st-btn');
  if (!btn) return;
  const id = btn.closest('.sticky').dataset.id;
  const t = tareas.find(x => x.id === id);
  if (!t) return;
  if (btn.dataset.action === 'hecha') {
    guardar(id, { hecha: !t.hecha });
  } else if (btn.dataset.action === 'eliminar') {
    if (!confirm(`¿Eliminar "${t.titulo}"?`)) return;
    try { await deleteDoc(doc(db, 'tareas', id)); }
    catch (err) { setSync('Error al eliminar: ' + err.message, 'err'); }
  }
});
$('matriz').addEventListener('keydown', e => {
  const el = e.target.closest('.sticky');
  if (el && e.key === 'Enter') abrirEditor(el.dataset.id);
});

// ---------- Arrastrar (mouse y táctil) ----------
$('matriz').addEventListener('pointerdown', e => {
  const el = e.target.closest('.sticky');
  if (!el || e.target.closest('button') || e.button !== 0) return;
  const r = el.getBoundingClientRect();
  drag = {
    el, id: el.dataset.id, pointerId: e.pointerId,
    startX: e.clientX, startY: e.clientY,
    offX: e.clientX - r.left, offY: e.clientY - r.top,
    w: el.offsetWidth, h: el.offsetHeight,
    moviendo: false, fantasma: null, resaltado: null
  };
  el.setPointerCapture(e.pointerId);
});

function corchoBajo(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('.corcho') : null;
}

document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.moviendo) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 5) return;
    drag.moviendo = true;
    const f = drag.el.cloneNode(true);
    f.classList.add('fantasma');
    const rot = parseFloat(drag.el.style.transform.replace(/[^\d.-]/g, '')) || 0;
    f.style.transform = `rotate(${rot + 3}deg) scale(1.06)`;
    document.body.appendChild(f);
    drag.fantasma = f;
    drag.el.style.visibility = 'hidden';
  }
  drag.fantasma.style.left = (e.clientX - drag.offX) + 'px';
  drag.fantasma.style.top  = (e.clientY - drag.offY) + 'px';
  const c = corchoBajo(e.clientX, e.clientY);
  if (c !== drag.resaltado) {
    drag.resaltado?.classList.remove('destino');
    c?.classList.add('destino');
    drag.resaltado = c;
  }
});

function terminarDrag() {
  const d = drag;
  drag = null;
  if (d?.fantasma) d.fantasma.remove();
  d?.resaltado?.classList.remove('destino');
  return d;
}

document.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = terminarDrag();
  if (!d.moviendo) { renderPendiente && render(); abrirEditor(d.id); return; }
  const destino = corchoBajo(e.clientX, e.clientY);
  const t = tareas.find(x => x.id === d.id);
  if (destino && t) {
    const r = destino.getBoundingClientRect();
    const cambios = {
      x: +clamp((e.clientX - d.offX - r.left) / (r.width  - d.w), 0, 1).toFixed(3),
      y: +clamp((e.clientY - d.offY - r.top)  / (r.height - d.h), 0, 1).toFixed(3),
      cuadrante: destino.dataset.q
    };
    if (cambios.cuadrante !== cuadranteDe(t)) cambios.rot = rotAleatoria();
    Object.assign(t, cambios);   // se ve al instante; Firestore confirma después
    render();
    guardar(d.id, cambios);
  } else {
    render();
  }
});

document.addEventListener('pointercancel', e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  terminarDrag();
  render();
});

// ---------- Modal editar ----------
let editId = null;
function abrirEditor(id) {
  const t = tareas.find(x => x.id === id);
  if (!t) return;
  editId = id;
  $('m-titulo').value = t.titulo || '';
  $('m-detalle').value = t.detalle || '';
  $('m-cuadrante').value = cuadranteDe(t);
  $('m-fecha').value = t.fecha || '';
  $('modal').classList.add('open');
  setTimeout(() => $('m-titulo').focus(), 50);
}
function cerrarEditor() { $('modal').classList.remove('open'); editId = null; }

$('m-guardar').addEventListener('click', () => {
  const t = tareas.find(x => x.id === editId);
  const titulo = $('m-titulo').value.trim();
  if (!t || !titulo) return;
  const q = $('m-cuadrante').value;
  const cambios = { titulo, detalle: $('m-detalle').value.trim(), fecha: $('m-fecha').value || null, cuadrante: q };
  if (q !== cuadranteDe(t)) Object.assign(cambios, posicionLibre(q, t.id), { rot: rotAleatoria() });
  guardar(editId, cambios);
  cerrarEditor();
});
$('m-eliminar').addEventListener('click', async () => {
  const t = tareas.find(x => x.id === editId);
  if (!t || !confirm(`¿Eliminar "${t.titulo}"?`)) return;
  const id = editId;
  cerrarEditor();
  try { await deleteDoc(doc(db, 'tareas', id)); }
  catch (e) { setSync('Error al eliminar: ' + e.message, 'err'); }
});
$('m-cancelar').addEventListener('click', cerrarEditor);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) cerrarEditor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editId) cerrarEditor(); });

$('btn-logout').addEventListener('click', async () => {
  try { await signOut(auth); } catch (e) {}
  window.location.href = 'index.html';
});

// ---------- Firestore en vivo ----------
function suscribir() {
  setSync('Cargando…');
  onSnapshot(query(collection(db, 'tareas'), orderBy('creadoEn', 'asc')), snap => {
    tareas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setSync('✓ Sincronizado', 'ok');
    render();
  }, err => {
    console.error(err);
    setSync(err.code === 'permission-denied'
      ? 'Sin permiso: las reglas de Firestore no incluyen la colección "tareas"'
      : 'Sin conexión: ' + err.message, 'err');
  });
}

render();
protegerPagina(suscribir);
</script>
